[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-gfx-ai"
version = "0.1.0"
description = "Local Roblox GFX generator (stylized placeholder)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CallConfirm" }]
dependencies = ["Pillow>=10.0.0"]

[project.scripts]
roblox-gfx-ai = "roblox_gfx_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
